# --- End to end: the same questions on the gold context, then on the retrieved one --------
# A generation arm with `context = "retrieved"` searches the corpus of its dataset through
# the API's own document source and hands the `top_k` chunks to the generator. Next to the
# same questions answered on the gold passages, the difference is what the search costs.
#
#   context          "gold" (default) | "retrieved" | "none" (closed book, below)
#   top_k            chunks handed to the generator (5: the API's default)
#   embedding_model, chunk_size, chunk_overlap   the index searched, as for a retrieval arm
#
# HotpotQA: questions that need two paragraphs. `hotpotqa/pool-1000` = the paragraphs of
# 1,000 questions of the distractor setting as one corpus (9,789 paragraphs). No published
# score applies to such a pool: the arms are compared with each other.
# QASPER: questions about one paper, searched inside that paper (the scope of a question).

[suites.end-to-end]
description = "The phase 1 system end to end, next to the same questions on the gold context."
metrics = ["recall_at_5", "recall_at_10", "ndcg_at_10", "mrr_at_10"]

[[suites.end-to-end.retrieval]]
name = "hotpotqa-bm25"
dataset = "hotpotqa/pool-1000"
split = "validation"
retriever = "bm25"

[[suites.end-to-end.retrieval]]
name = "hotpotqa-oai-chunks-hnsw"
dataset = "hotpotqa/pool-1000"
split = "validation"
retriever = "dense"
embedding_model = "openai/text-embedding-3-small"
search = "hnsw"

[[suites.end-to-end.generation]]
name = "hotpotqa-gold"
dataset = "hotpotqa/pool-1000"
max_examples = 100
seed = 0

[[suites.end-to-end.generation]]
name = "hotpotqa-retrieved"
dataset = "hotpotqa/pool-1000"
max_examples = 100
seed = 0
context = "retrieved"
embedding_model = "openai/text-embedding-3-small"

[[suites.end-to-end.generation]]
name = "qasper-gold"
dataset = "qasper"
max_examples = 100
seed = 0

[[suites.end-to-end.generation]]
name = "qasper-retrieved"
dataset = "qasper"
max_examples = 100
seed = 0
context = "retrieved"
embedding_model = "openai/text-embedding-3-small"

# --- Closed book: the same questions without any document --------------------------------
# The contamination probe (phase 2.5). A question the generator answers correctly with no
# document at all was not answered thanks to the documents: on such questions a benchmark
# measures what the model remembers. Same questions as the arms above (same sizes, same
# seeds), another prompt (prompts/closed_book.md): answer in one sentence, or say that you
# do not know.

[suites.contamination]
description = "Closed-book probes: what the generator answers without any document."

[[suites.contamination.generation]]
name = "squad-closed-book"
dataset = "squad_v2"
max_examples = 100
seed = 0
context = "none"
prompt = "closed_book"

[[suites.contamination.generation]]
name = "hotpotqa-closed-book"
dataset = "hotpotqa/pool-1000"
max_examples = 100
seed = 0
context = "none"
prompt = "closed_book"

[[suites.contamination.generation]]
name = "qasper-closed-book"
dataset = "qasper"
max_examples = 100
seed = 0
context = "none"
prompt = "closed_book"

