# --- The regression gate ----------------------------------------------------------------
# Sample mode only (`make eval-gate` forces it): fixtures and a simulated embedder, a few
# seconds, no key. It guards the code paths (loaders, chunking, storage, both search modes,
# metrics), not the quality of a model. Baseline: data/results/gate/baseline.json.

[suites.gate]
description = "Regression gate in sample mode: every code path of the harness on fixtures."

[[suites.gate.arms]]
name = "scifact-bm25"
dataset = "beir/scifact"
retriever = "bm25"

[[suites.gate.arms]]
name = "nfcorpus-bm25"
dataset = "beir/nfcorpus"
retriever = "bm25"

[[suites.gate.arms]]
name = "scifact-dense-whole-exact"
dataset = "beir/scifact"
retriever = "dense"
embedding_model = "openai/text-embedding-3-small"
chunk_size = 0
search = "exact"

[[suites.gate.arms]]
name = "scifact-dense-chunks-hnsw"
dataset = "beir/scifact"
retriever = "dense"
embedding_model = "openai/text-embedding-3-small"
chunk_size = 120
chunk_overlap = 30
search = "hnsw"

[[suites.gate.arms]]
name = "nfcorpus-dense-chunks-exact"
dataset = "beir/nfcorpus"
retriever = "dense"
embedding_model = "openai/text-embedding-3-small"
chunk_size = 60
chunk_overlap = 0
search = "exact"
