# --- Generation on gold context -----------------------------------------------------------
# The generator receives the passages a perfect retriever would return: what goes wrong
# here is not retrieval. Lean sizes (decision of 2026-11-05): 100 questions, half of them
# unanswerable, and 50 of them asked three times to see what changes between runs.
#
#   generator        backend/model (default: the registry's generator)
#   max_examples     size of the seeded subsample (half answerable, half unanswerable)
#   repeats, repeat_examples   ask the first `repeat_examples` questions `repeats` times
#   max_output_tokens   output cap of a call, reasoning included (default: the API's, 4096).
#                    The model reasons before it writes and those tokens count: a cap sized
#                    for the visible answer cuts it. Every run reports its share of cut answers.

[suites.generation-baseline]
description = "Phase 2 baseline of the generator on gold context: refusals, citations, reference answers."

[[suites.generation-baseline.generation]]
name = "squad-gold-sonnet"
dataset = "squad_v2"
max_examples = 100
seed = 0
repeats = 3
repeat_examples = 50
