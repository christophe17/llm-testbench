[[suites.retrieval-baseline.arms]]
name = "nfcorpus-bge-whole-exact"
dataset = "beir/nfcorpus"
retriever = "dense"
embedding_model = "hf/BAAI/bge-base-en-v1.5"
chunk_size = 0
search = "exact"
references = [
    { label = "model card (MTEB)", value = 0.3739, source = "HF model card of BAAI/bge-base-en-v1.5, read on 2026-11-05" },
]

[[suites.retrieval-baseline.arms]]
name = "nfcorpus-oai-chunks-hnsw"
dataset = "beir/nfcorpus"
retriever = "dense"
embedding_model = "openai/text-embedding-3-small"
