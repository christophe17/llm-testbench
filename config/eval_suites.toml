# Evaluation suites of the harness (phase 2): what `make eval` runs.
#
# A suite is a named group of arms; an arm is one system under measurement. Two kinds of
# arms, each under its own key of the suite:
#
#   [[suites.<suite>.retrieval]]    a retrieval arm: a search measured on a retrieval dataset
#   [[suites.<suite>.generation]]   a generation arm: the generator measured on a QA dataset
#                                   (settings listed above the suites that have some)
#
# A retrieval arm = a dataset, a retriever and, for a dense retriever, the index it reads
# (chunking, embedding model, how the index is searched). The index is built on demand by
# the ingestion pipeline; one that exists costs nothing.
#
#   retriever        "bm25" | "dense"
#   embedding_model  backend/model (dense)
#   chunk_size       characters; 0 = whole documents (default 1000, overlap 200: phase 1)
#   search           "hnsw" (the approximate index, default) | "exact" (every vector compared)
#   ef_search        pgvector's candidate list for hnsw (server default: 40; at most 1000)
#   index_key + source_key   pin an existing index instead of deriving its name
#
# The name of the index a dense arm reads. Left out, which is the usual case, it is derived
# from the arm as <dataset>-<chunking>-<model>: `nfcorpus-oai-chunks-hnsw` reads
# `nfcorpus-r1000-200-text-embedding-3-small`, built at its first run. `search` and
# `ef_search` are not part of the name: arms that differ only there read the same index.
# Only the SciFact "chunks" arms pin one, the index the API serves, built in phase 1 under
# an older name; without the pin they would build a copy of it and measure the copy.
#
# `references` are scores to compare ours with: published ones, or measured here with
# another tool. Each carries its source. The first one is the gap shown in the report.

# Hard cap, in dollars, on what the harness spends, all runs together
# (data/results/spend.jsonl). Decision of 2026-11-05.
[budget]
cap_usd = 10.0

[suites.retrieval-baseline]
description = "Phase 2 baseline: the harness validated against published scores, then the phase 1 system as built."

# --- SciFact: validate the harness ----------------------------------------------------

[[suites.retrieval-baseline.retrieval]]
name = "scifact-bm25"
dataset = "beir/scifact"
retriever = "bm25"
references = [
    { label = "mteb/baseline-bm25s", value = 0.6863, source = "our mteb run of 2026-11-04, data/results/bm25_scifact.json" },
    { label = "BM25 Anserini", value = 0.665, source = "Thakur et al. 2021, BEIR, table 2" },
]

[[suites.retrieval-baseline.retrieval]]
name = "scifact-bge-whole-exact"
