# Table de prix, en USD par million de tokens (ADR 006).
# Un modèle absent d'ici a un coût inconnu : le banc affiche « inconnu », jamais une estimation.
# Les prix changent sans préavis : la date de vérification fait partie de la donnée.

verified_on = 2026-10-19
source = "Anthropic : référence des modèles du 2026-10-06 (famille Claude 5.5 ajoutée le 2026-10-19 ; cache : lecture 0,1x et écriture 1,25x, sauf Opus 5.5 dont la lecture de cache est publiée à 0,20) ; OpenAI : page de prix officielle relevée le 2026-09-03, inchangée"

