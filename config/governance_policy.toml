# Data governance policy (ADR 006) — PROVISIONAL.
#
# The real constraints are not known yet (2026-09-03). This policy is a reasonable default,
# to be tightened or relaxed without touching the code. Deny by default: an unknown
# metadata value fails every requirement.
#
# Possible requirements per class:
#   allowed_regions               = ["eu", "self", "us", "variable"]
#   require_zero_retention        = true | false   (EFFECTIVE zero retention on our account)
#   forbid_training               = true | false   (the provider does not train on inputs)
#   forbid_variable_subprocessors = true | false   (no broker with variable hosts)

[rules.public]

[rules.internal]
forbid_training = true

[rules.confidential]
allowed_regions = ["eu", "self"]
require_zero_retention = true
forbid_training = true
forbid_variable_subprocessors = true

[rules.personal]
allowed_regions = ["eu", "self"]
require_zero_retention = true
forbid_training = true
forbid_variable_subprocessors = true

[rules.regulated]
allowed_regions = ["eu", "self"]
require_zero_retention = true
forbid_training = true
forbid_variable_subprocessors = true
