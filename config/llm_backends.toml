# LLM backends of the testbench and their governance metadata (ADR 006).
#
# A model is designated by "backend/model" (e.g. "anthropic/claude-sonnet-5-5",
# "openrouter/mistralai/mistral-large"). The backend is an entry of this file; the model
# is free-form, the provider validates it on the first call.
#
# The governance metadata are CLAIMS recorded from the providers' public pages on the
# indicated date, not contractual guarantees. `zero_retention` describes the effective
# configuration of OUR account, not what the provider offers. A missing value means
# "unknown" and the policy treats it as a denial.

[defaults]
generator = "anthropic/claude-sonnet-5-5"
embeddings = "openai/text-embedding-3-small"

[backends.anthropic]
kind = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
structured_output = "native"

[backends.anthropic.governance]
entity = "Anthropic PBC"
country = "US"
inference_region = "us"
default_retention_days = 30
zero_retention = false
zero_retention_available = true
trains_on_inputs = false
subprocessors = "fixed"
certifications = ["SOC 2 Type II", "ISO 27001", "ISO 42001"]
verified_on = 2026-09-03
notes = "Zero retention on request for API customers; EU residency not verified."

[backends.openai]
kind = "openai_compatible"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"
structured_output = "native"

[backends.openai.governance]
entity = "OpenAI, L.L.C."
country = "US"
inference_region = "us"
default_retention_days = 30
zero_retention = false
zero_retention_available = true
trains_on_inputs = false
subprocessors = "fixed"
certifications = ["SOC 2 Type II"]
verified_on = 2026-09-03
notes = "EU data residency available per project (dedicated endpoint), not enabled here."

[backends.openrouter]
kind = "openai_compatible"
api_key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"
structured_output = "prompt"

[backends.openrouter.governance]
entity = "OpenRouter, Inc."
country = "US"
inference_region = "variable"
zero_retention = false
subprocessors = "variable"
verified_on = 2026-09-03
notes = "Broker: each model is routed to a third-party host; retention and training depend on the host (filters available, not enabled here)."

[backends.bedrock]
kind = "anthropic_bedrock"
region = "eu-west-3"
structured_output = "native"
enabled = false

[backends.bedrock.governance]
entity = "Amazon Web Services EMEA SARL"
country = "LU"
inference_region = "eu"
default_retention_days = 0
zero_retention = true
zero_retention_available = true
trains_on_inputs = false
subprocessors = "fixed"
certifications = ["SOC 2 Type II", "ISO 27001", "HDS"]
verified_on = 2026-09-03
notes = "Enabled with the cloud infra (phase 1, guide 03). Availability of Claude models per EU region to be checked at coding time."

[backends.local]
kind = "openai_compatible"
base_url = "http://localhost:11434/v1"
structured_output = "prompt"
enabled = false

[backends.local.governance]
entity = "self"
country = "self"
inference_region = "self"
default_retention_days = 0
zero_retention = true
zero_retention_available = true
trains_on_inputs = false
subprocessors = "fixed"
verified_on = 2026-09-03
notes = "Ollama in phase 1 (dev), vLLM in phase 6. The text does not leave the machine."
