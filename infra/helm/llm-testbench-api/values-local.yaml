# k3d: image pushed to the local registry, a single replica, no autoscaling.
image:
  repository: llm-testbench-registry:5050/llm-testbench-api
  tag: dev
  pullPolicy: Always
# Tilt loop (guide 01b, step 8): live_update copies src/, prompts/ and config/ into the
# running container, and uvicorn --reload restarts the server process on each change. By
# default uvicorn reloads on *.py only: the includes cover the prompts (.md) and the config
# (.toml).
args:
  - uvicorn
  - llm_testbench.app.main:app
  - --host=0.0.0.0
  - --port=8000
  - --reload
  - --reload-dir=/app/src
  - --reload-dir=/app/prompts
  - --reload-dir=/app/config
  - --reload-include=*.md
  - --reload-include=*.toml
# The sync writes into /app, which a read-only root filesystem refuses. Production keeps it
# read-only (values.yaml).
securityContext:
  readOnlyRootFilesystem: false
replicaCount: 1
autoscaling:
  enabled: false
podDisruptionBudget:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 768Mi
config:
  LLM_TESTBENCH_DATABASE_URL: postgresql://testbench:testbench-local-only@postgres.llm-testbench:5432/testbench
  # Traces to Langfuse (guide 07). The keys are those of the local headless initialization
  # (infra/helm/langfuse/values-local.yaml): dev constants, not secrets.
  LLM_TESTBENCH_OTLP_ENDPOINT: http://langfuse-web.observability:3000/api/public/otel/v1/traces
  LLM_TESTBENCH_LANGFUSE_PUBLIC_KEY: pk-lf-local-0000000000000000
  LLM_TESTBENCH_LANGFUSE_SECRET_KEY: sk-lf-local-0000000000000000
