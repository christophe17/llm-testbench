# Default values: production grade (probes, resources, HPA, PDB, non-root).
# The local (k3d) and cloud (EKS) values override the image, the secrets and the exposure.

image:
  repository: llm-testbench-api
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

# Non-secret environment variables (LLM_TESTBENCH_ prefix on the application side).
config:
  LLM_TESTBENCH_INDEX_KEY: scifact-recursive-oai-small
  LLM_TESTBENCH_SOURCE_KEY: "docs:scifact"
  LLM_TESTBENCH_RETRIEVAL_K: "5"
  LLM_TESTBENCH_SERVICE_NAME: llm-testbench-api
  # LLM_TESTBENCH_OTLP_ENDPOINT: http://langfuse-web.observability:3000/api/public/otel/v1/traces

# Secrets: either an existing Kubernetes Secret (local), or External Secrets (cloud).
secrets:
  existingSecret: llm-testbench-api-secrets
  externalSecret:
    enabled: false
    secretStoreRef:
      name: aws-secrets-manager
      kind: ClusterSecretStore
    refreshInterval: 1h
    # One Secrets Manager key per variable: {name: VARIABLE_NAME, key: path/to/secret}
    data: []

# Cloud database: nothing secret here. If `masterSecretArn` is set (RDS-managed secret,
# {username, password}), the ExternalSecret composes LLM_TESTBENCH_DATABASE_URL in the
# cluster from these three values and the secret (guide 05). Filled in by `make deploy`
# and by the deployment workflow from the Terraform outputs / the RDS API.
database:
  host: ""
  port: 5432
  name: testbench
  masterSecretArn: ""

serviceAccount:
  create: true
  annotations: {}   # EKS: eks.amazonaws.com/role-arn for Bedrock access (guide 03)

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi   # no CPU limit: CFS throttling degrades latency without protecting anything

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  startup:
    path: /healthz
    failureThreshold: 30   # 30 × 2 s: the Postgres pool and the schema can take a while
    periodSeconds: 2
  readiness:
    path: /readyz          # 503 until the index is there: the pod receives nothing
    periodSeconds: 10
  liveness:
    path: /healthz
    periodSeconds: 20

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

terminationGracePeriodSeconds: 30
