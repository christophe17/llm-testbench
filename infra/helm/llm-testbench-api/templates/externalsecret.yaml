{{- if .Values.secrets.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.secrets.existingSecret }}
    creationPolicy: Owner
    {{- if .Values.database.masterSecretArn }}
    # The database URL is composed HERE, by the operator, from the RDS-managed secret:
    # the password goes through neither Terraform nor a second secret (guide 05, ADR 009).
    # `urlquery` (a native Go template function) encodes the URL's reserved characters.
    # The double braces below belong to the External Secrets template, not to Helm.
    template:
      engineVersion: v2
      data:
        {{- range .Values.secrets.externalSecret.data }}
        {{ .name }}: {{ printf "{{ .%s }}" .name | quote }}
        {{- end }}
        LLM_TESTBENCH_DATABASE_URL: {{ printf "postgresql://{{ .db_username }}:{{ .db_password | urlquery }}@%s:%v/%s" .Values.database.host .Values.database.port .Values.database.name | quote }}
    {{- end }}
  data:
    {{- range .Values.secrets.externalSecret.data }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ .key }}
    {{- end }}
    {{- if .Values.database.masterSecretArn }}
    - secretKey: db_username
      remoteRef:
        key: {{ .Values.database.masterSecretArn }}
        property: username
    - secretKey: db_password
      remoteRef:
        key: {{ .Values.database.masterSecretArn }}
        property: password
    {{- end }}
{{- end }}
