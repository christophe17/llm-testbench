# EKS dev: ECR image, secrets through External Secrets from AWS Secrets Manager,
# pod identity for Bedrock. The <...> values are filled in by `make deploy` (Terraform
# outputs) or by the deploy.yml workflow (AWS API) — guides 06 and 09.
image:
  repository: "<ecr_repository_url>"
  tag: "<git_sha>"
replicaCount: 2
secrets:
  existingSecret: llm-testbench-api-secrets
  externalSecret:
    enabled: true
    data:
      - name: ANTHROPIC_API_KEY
        key: llm-testbench/dev/anthropic-api-key
      - name: OPENAI_API_KEY
        key: llm-testbench/dev/openai-api-key
      - name: OPENROUTER_API_KEY
        key: llm-testbench/dev/openrouter-api-key
# The database URL is composed in the cluster by External Secrets (guide 05):
database:
  host: "<rds_address>"
  port: 5432
  name: testbench
  masterSecretArn: "<rds_master_secret_arn>"
# No IRSA annotation: Bedrock access goes through EKS Pod Identity, associated by
# Terraform with the (namespace llm-testbench, ServiceAccount api) pair — iam.tf.
serviceAccount:
  create: true
