# EKS dev : image ECR, secrets par External Secrets depuis AWS Secrets Manager,
# identité de pod pour Bedrock. Les valeurs <...> sont remplies par `make deploy`
# depuis les sorties Terraform (guide 06).
image:
  repository: "<ecr_repository_url>"
  tag: "<git_sha>"
replicaCount: 2
secrets:
  existingSecret: llm-testbench-api-secrets
  externalSecret:
    enabled: true
    data:
      - name: ANTHROPIC_API_KEY
        key: llm-testbench/dev/anthropic-api-key
      - name: OPENAI_API_KEY
        key: llm-testbench/dev/openai-api-key
      - name: OPENROUTER_API_KEY
        key: llm-testbench/dev/openrouter-api-key
      - name: LLM_TESTBENCH_DATABASE_URL
        key: llm-testbench/dev/database-url
# Aucune annotation IRSA : l'accès Bedrock passe par EKS Pod Identity, associé par
# Terraform au couple (namespace llm-testbench, ServiceAccount api) — iam.tf.
serviceAccount:
  create: true
