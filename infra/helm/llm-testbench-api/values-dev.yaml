# EKS dev : image ECR, secrets par External Secrets depuis AWS Secrets Manager,
# identité de pod pour Bedrock. Les valeurs <...> sont remplies par `make deploy` (sorties
# Terraform) ou par le workflow deploy.yml (API AWS) — guides 06 et 09.
image:
  repository: "<ecr_repository_url>"
  tag: "<git_sha>"
replicaCount: 2
secrets:
  existingSecret: llm-testbench-api-secrets
  externalSecret:
    enabled: true
    data:
      - name: ANTHROPIC_API_KEY
        key: llm-testbench/dev/anthropic-api-key
      - name: OPENAI_API_KEY
        key: llm-testbench/dev/openai-api-key
      - name: OPENROUTER_API_KEY
        key: llm-testbench/dev/openrouter-api-key
# L'URL de la base est composée dans le cluster par External Secrets (guide 05) :
database:
  host: "<rds_address>"
  port: 5432
  name: testbench
  masterSecretArn: "<rds_master_secret_arn>"
# Aucune annotation IRSA : l'accès Bedrock passe par EKS Pod Identity, associé par
# Terraform au couple (namespace llm-testbench, ServiceAccount api) — iam.tf.
serviceAccount:
  create: true
