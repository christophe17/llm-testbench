# Cluster de dev local — macOS Apple Silicon, images arm64 uniquement.
# `make k3d-up` / `make k3d-down`. Dimensionné au strict nécessaire de la phase 0 :
# un seul nœud, un registre local pour les images applicatives de la phase 1.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: llm-testbench
servers: 1
agents: 0
registries:
  create:
    name: llm-testbench-registry
    host: "0.0.0.0"
    hostPort: "5050"
options:
  k3s:
    extraArgs:
      # Traefik inutile tant qu'aucune API n'est déployée (phase 1)
      - arg: --disable=traefik
        nodeFilters: [server:*]
