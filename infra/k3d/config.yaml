# Local dev cluster — macOS Apple Silicon, arm64 images only.
# `make k3d-up` / `make k3d-down`. Sized to the bare minimum of phase 0:
# a single node, a local registry for the phase 1 application images.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: llm-testbench
servers: 1
agents: 0
registries:
  create:
    name: llm-testbench-registry
    host: "0.0.0.0"
    hostPort: "5050"
options:
  k3s:
    extraArgs:
      # Traefik is useless as long as no API is deployed (phase 1)
      - arg: --disable=traefik
        nodeFilters: [server:*]
