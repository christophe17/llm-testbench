# Single-node ClickHouse for local Langfuse (guide 07).
#
# The Langfuse 2.x chart deploys ClickHouse through an operator (CRD + Keeper ×3): too heavy
# for the brief's "bare minimum" on a k3d. The chart accepts an external non-clustered
# ClickHouse: here it is, in 60 lines. Multi-arch image (native arm64 verified).
# Plaintext credentials: LOCALLY ONLY.
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
type: Opaque
stringData:
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: clickhouse-local-only
  CLICKHOUSE_DB: default
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.4
          ports:
            - containerPort: 8123
            - containerPort: 9000
          envFrom:
            - secretRef:
                name: clickhouse-credentials
          env:
            # Allows the password of the default account (the image refuses it otherwise).
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
      securityContext:
        fsGroup: 101
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
