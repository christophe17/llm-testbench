# External Secrets: the AWS Secrets Manager secret store, authenticated by the controller's
# pod identity (no key, no role to annotate: the Pod Identity association is created by
# Terraform, iam.tf).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-3
