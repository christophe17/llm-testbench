# External Secrets : le magasin de secrets AWS Secrets Manager, authentifié par l'identité
# de pod du contrôleur (aucune clé, aucun rôle à annoter : l'association Pod Identity est
# créée par Terraform, iam.tf).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-3
