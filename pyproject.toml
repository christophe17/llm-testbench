[project]
name = "llm-testbench"
version = "0.1.0"
description = "Banc d'essai technique chiffré : RAG, agents multi-sources, évaluation, LLMOps"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Christophe Dufour", email = "dufour.chri@gmail.com" }]
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "datasets>=3.0",
    "huggingface-hub>=0.24",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pre-commit>=3.8",
    "nbmake>=1.5",
    "jupytext>=1.16",
    "ipykernel>=6.29",
    "types-tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_testbench"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "PTH", # pathlib partout
    "RUF",
]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["llm_testbench"]

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = [
    "network: tests qui téléchargent des données (exclus par défaut, `make test-network`)",
]
