# Deployment of the API to the dev EKS cluster, triggered by hand (the cluster is
# ephemeral: an automatic deployment on every push would fail in the evening).
# No AWS key in GitHub: the job obtains temporary credentials through OIDC by assuming
# the role created by the Terraform bootstrap (infra/terraform/bootstrap/github.tf).
# What this workflow does is exactly `make deploy` (guide 09).
name: deploy

on:
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for AssumeRoleWithWebIdentity
  contents: read

# Only one deployment at a time on the dev environment.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  CLUSTER_NAME: llm-testbench-dev
  ECR_REPOSITORY: llm-testbench-api
  NAMESPACE: llm-testbench

jobs:
  deploy:
    # arm64 runner: same architecture as the Graviton nodes, no QEMU emulation.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image (tag = git SHA)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$IMAGE:${TAG::7}" .
          docker push "$IMAGE:${TAG::7}"

      - name: Kubeconfig and database parameters (AWS API, not the Terraform state)
        id: params
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
          read -r RDS_HOST RDS_SECRET < <(aws rds describe-db-instances \
            --db-instance-identifier "$CLUSTER_NAME" \
            --query 'DBInstances[0].[Endpoint.Address,MasterUserSecret.SecretArn]' --output text)
          echo "rds_host=$RDS_HOST" >> "$GITHUB_OUTPUT"
          echo "rds_secret=$RDS_SECRET" >> "$GITHUB_OUTPUT"

      - name: Helm upgrade
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install api infra/helm/llm-testbench-api -n "$NAMESPACE" \
            -f infra/helm/llm-testbench-api/values-dev.yaml \
            --set image.repository="$IMAGE" --set image.tag="${TAG::7}" \
            --set database.host="${{ steps.params.outputs.rds_host }}" \
            --set database.masterSecretArn="${{ steps.params.outputs.rds_secret }}"

      # Readiness refuses as long as the index does not exist in RDS (guide 04): a rollout
      # that does not complete is not necessarily a failed deployment. We observe, we do not decide.
      - name: Rollout status
        continue-on-error: true
        run: kubectl -n "$NAMESPACE" rollout status deploy/api --timeout=180s

      - name: Pods and ExternalSecret
        if: always()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide
          kubectl -n "$NAMESPACE" get externalsecret
