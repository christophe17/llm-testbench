# CI hors ligne : aucun secret, aucun appel réseau vers des providers.
# Les notebooks tournent en mode échantillon sur les fixtures de tests ;
# les chiffres publiés sont produits par des exécutions complètes manuelles (brief §2.B.4).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # Postgres + pgvector comme service : les tests `db` et le notebook 2 tournent en CI,
    # toujours sans secret ni appel réseau vers un provider (ADR 003, ADR 007).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testbench
          POSTGRES_PASSWORD: testbench-ci
          POSTGRES_DB: testbench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U testbench -d testbench"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LLM_TESTBENCH_DATABASE_URL: postgresql://testbench:testbench-ci@localhost:5432/testbench
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Typecheck (mypy strict)
        run: uv run mypy

      - name: Tests (hors ligne, base incluse)
        run: uv run python -m pytest -m "not network"

      - name: Notebooks (mode échantillon, hors ligne)
        env:
          LLM_TESTBENCH_SAMPLE: "1"
        run: |
          uv run python -m ipykernel install --user --name llm-testbench
          uv run pytest --nbmake notebooks/00_visite_guidee.ipynb notebooks/01_appel_llm_robuste.ipynb
