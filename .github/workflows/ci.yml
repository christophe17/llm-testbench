# Offline CI: no secret, no network call to providers.
# The notebooks run in sample mode on the test fixtures;
# the published numbers are produced by manual full runs (brief §2.B.4).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # Postgres + pgvector as a service: the `db` tests and notebook 2 run in CI,
    # still with no secret and no network call to a provider (ADR 003, ADR 007).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testbench
          POSTGRES_PASSWORD: testbench-ci
          POSTGRES_DB: testbench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U testbench -d testbench"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LLM_TESTBENCH_DATABASE_URL: postgresql://testbench:testbench-ci@localhost:5432/testbench
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Typecheck (mypy strict)
        run: uv run mypy

      - name: Tests (offline, database included)
        run: uv run python -m pytest -m "not network"

      - name: Notebooks (sample mode, offline)
        env:
          LLM_TESTBENCH_SAMPLE: "1"
        run: |
          uv run python -m ipykernel install --user --name llm-testbench
          uv run python -m pytest --nbmake notebooks
