# `pre-commit install` installs both hook types; every hook runs at commit time unless it
# says otherwise (the evaluation gate runs at push time).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^infra/helm/.*/templates/
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict

  # ruff and mypy run with the project's versions (uv), never with a separately pinned
  # version: two versions of the same linter end up contradicting each other.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^(src|tests)/.*\.py$
      # Phase 2.7: we work on main without PRs (ADR 008), so nothing can block a merge.
      # The block moves here: a push that lowers a sample-mode score is refused. Bypassed
      # by --no-verify, in which case the same gate turns the CI red on main.
      - id: eval-gate
        name: evaluation gate (sample mode)
        entry: make eval-gate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
