repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^infra/helm/.*/templates/
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict

  # ruff et mypy tournent avec les versions du projet (uv), jamais avec une version
  # épinglée à part : deux versions d'un même linter finissent par se contredire.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^(src|tests)/.*\.py$
